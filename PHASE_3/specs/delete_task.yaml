name: delete_task
purpose: Remove a task from the list
parameters:
  user_id:
    type: string
    required: true
  task_id:
    type: integer
    required: true
returns:
  task_id: int
  status: string
  title: string
example_input:
  user_id: "ziakhan"
  task_id: 2
example_output:
  task_id: 2
  status: "deleted"
  title: "Old task"